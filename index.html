<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Grapher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: top bar with sheet tabs / workspace (worksheet | graph, results below) / settings rail on the right */
:root {
  --bg: #ECEFF3;
  --surface: #FFFFFF;
  --surface-2: #F5F7FA;
  --ink: #16202B;
  --muted: #5B6777;
  --line: #D4DBE3;
  --accent: #1F5FAD;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2EBF7;
  --x-tint: #FFF4DB;
  --err-tint: #F1E9FB;
  --ok: #1D7A4E;
  --ok-soft: #E1F3EA;
  --bad: #B3261E;
  --bad-soft: #FBE7E5;
  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --radius: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141A; --surface: #171E27; --surface-2: #1E2632; --ink: #E5EAF0; --muted: #96A2B2; --line: #2C3644;
    --accent: #6FA5F2; --accent-ink: #0A1220; --accent-soft: #1C2B41; --x-tint: #33290F; --err-tint: #2A2038;
    --ok: #5BC492; --ok-soft: #15301F; --bad: #F08A80; --bad-soft: #3A1916; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141A; --surface: #171E27; --surface-2: #1E2632; --ink: #E5EAF0; --muted: #96A2B2; --line: #2C3644;
  --accent: #6FA5F2; --accent-ink: #0A1220; --accent-soft: #1C2B41; --x-tint: #33290F; --err-tint: #2A2038;
  --ok: #5BC492; --ok-soft: #15301F; --bad: #F08A80; --bad-soft: #3A1916; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h2, h3 { text-wrap: balance; margin: 0; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: 0; z-index: 20; }
.brand { font-weight: 600; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand svg { display: block; }
.tabs { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
.tab { display: flex; align-items: center; gap: 2px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 0 2px 0 10px; height: 30px; white-space: nowrap; }
.tab.active { background: var(--accent-soft); border-color: var(--accent); }
.tab button.tab-name { border: 0; background: none; padding: 4px 4px; cursor: pointer; font-weight: 500; }
.tab input { width: 140px; border: 1px solid var(--accent); border-radius: 4px; padding: 2px 4px; background: var(--surface); }
.tab .x { border: 0; background: none; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; color: var(--muted); }
.tab .x:hover { background: var(--line); color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { height: 26px; padding: 0 9px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.top-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* main layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 312px; gap: 16px; padding: 16px; align-items: start; }
.work { display: grid; grid-template-columns: minmax(280px, 0.8fr) minmax(0, 1.25fr); gap: 16px; min-width: 0; }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; display: flex; flex-direction: column; }
.pane-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pane-head h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: auto; }
.results-pane { grid-column: 1 / -1; }

/* worksheet */
.grid-wrap { overflow: auto; max-height: 520px; }
table.grid { border-collapse: separate; border-spacing: 0; font-family: var(--font-num); font-size: 13px; }
.grid th, .grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; }
.grid thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 2; vertical-align: top; }
.grid th.corner { left: 0; z-index: 3; width: 40px; }
.grid th.rown { position: sticky; left: 0; background: var(--surface-2); color: var(--muted); font-weight: 400; width: 40px; min-width: 40px; text-align: center; z-index: 1; }
.colhead { min-width: 104px; width: 104px; }
.ch-top { display: flex; align-items: center; gap: 4px; padding: 4px 4px 2px 8px; font-family: var(--font-ui); font-size: 12px; }
.ch-top .letter { font-weight: 600; }
.ch-top .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 0 5px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ch-top .spacer { flex: 1; }
.ch-top select { font-size: 11px; padding: 0 2px; height: 20px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); }
.ch-top label { display: flex; align-items: center; gap: 3px; color: var(--muted); cursor: pointer; }
.icon-btn { border: 0; background: none; width: 20px; height: 20px; border-radius: 4px; cursor: pointer; color: var(--muted); line-height: 1; }
.icon-btn:hover { background: var(--line); color: var(--ink); }
.grid input.name { width: 100%; border: 0; border-top: 1px dashed var(--line); background: transparent; padding: 5px 8px; font-family: var(--font-ui); font-weight: 600; font-size: 13px; }
.grid input.cell { width: 104px; border: 0; background: transparent; padding: 4px 8px; height: 27px; text-align: right; font-variant-numeric: tabular-nums; }
.grid input:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--surface); }
.grid .is-x { background: var(--x-tint); }
.grid .is-err { background: var(--err-tint); }
.grid .is-skip { opacity: .5; }
.grid td.is-x, .grid td.is-err { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.grid th.addcol { border-right: 0; padding: 6px; background: var(--surface-2); }
.grid td.filler { border-right: 0; }
.sheet-foot { padding: 8px 12px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }

/* graph */
.fig-wrap { padding: 16px; background: repeating-conic-gradient(var(--surface-2) 0% 25%, var(--surface) 0% 50%) 0 0 / 16px 16px; display: flex; justify-content: center; overflow: auto; flex: 1; }
#fig svg { display: block; width: 100%; height: auto; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.08); }
.export-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.export-row select { height: 26px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; }

/* results */
.results { padding: 12px 14px 16px; display: grid; gap: 18px; }
.verdict { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.neutral { background: var(--surface-2); color: var(--muted); border-color: var(--line); }
.verdict .stat-line { font-family: var(--font-num); font-size: 13px; }
.block-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.block-head h3 { font-size: 14px; font-weight: 600; }
.block-head .note { color: var(--muted); font-size: 12px; margin-right: auto; }
.table-scroll { overflow-x: auto; }
table.rt { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.rt th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.rt td { padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.rt td.n { font-family: var(--font-num); text-align: right; font-variant-numeric: tabular-nums; }
.rt th.n { text-align: right; }
.rt .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.25); }
.legend-text { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 13px; max-width: 80ch; }
.empty-msg { color: var(--muted); padding: 8px 0; }

/* settings rail */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); position: sticky; top: 66px; max-height: calc(100vh - 82px); overflow: auto; }
.panel details { border-bottom: 1px solid var(--line); }
.panel summary { list-style: none; cursor: pointer; padding: 11px 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel summary::-webkit-details-marker { display: none; }
.panel summary::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
.panel details[open] summary::after { transform: rotate(-135deg); }
.sec { padding: 0 14px 14px; display: grid; gap: 10px; }
.field { display: grid; gap: 4px; }
.field > span, .field > label.lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
.field input[type=text], .field input[type=number], .field select { height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; background: var(--surface); width: 100%; min-width: 0; }
.field input[type=range] { width: 100%; accent-color: var(--accent); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 13px; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg label { flex: 1; text-align: center; cursor: pointer; font-size: 12.5px; padding: 5px 4px; border-right: 1px solid var(--line); background: var(--surface); }
.seg label:last-child { border-right: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.swatches { display: flex; gap: 3px; }
.swatches i { flex: 1; height: 10px; border-radius: 2px; }
.color-list { display: grid; gap: 6px; }
.color-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.color-row input[type=color] { width: 34px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
.color-row code { font-family: var(--font-num); font-size: 12px; color: var(--muted); margin-left: auto; }
.panel[data-mode="xy"] .only-groups, .panel[data-mode="groups"] .only-xy { display: none; }
.panel-foot { padding: 12px 14px; display: flex; gap: 8px; flex-wrap: wrap; }

/* modal + toast */
.modal-back { position: fixed; inset: 0; background: rgba(10,15,22,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal-back.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: min(640px, 100%); max-height: calc(100% - 32px); overflow: auto; padding: 18px; display: grid; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal h2 { font-size: 17px; }
.modal p { margin: 0; color: var(--muted); }
.modal textarea { width: 100%; min-height: 180px; border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-family: var(--font-num); font-size: 13px; background: var(--surface-2); resize: vertical; }
.modal .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.modal .preview { font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.modal img { max-width: 100%; border: 1px solid var(--line); background: #fff; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; display: none; align-items: center; gap: 12px; z-index: 60; max-width: calc(100% - 32px); }
.toast.show { display: flex; }
.toast button { background: none; border: 0; color: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; }

@media (max-width: 1180px) { .work { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; }
}
@media (max-width: 480px) {
  .layout { padding: 12px; gap: 12px; }
  .top { padding: 8px 12px; }
  .fig-wrap { padding: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F5FAD">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="Paste lab data, run ANOVA and post hoc tests, and export publication-ready graphs.">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="4" fill="var(--accent)"/><rect x="5" y="11" width="3" height="6" fill="var(--accent-ink)"/><rect x="9.5" y="7" width="3" height="10" fill="var(--accent-ink)"/><rect x="14" y="9" width="3" height="8" fill="var(--accent-ink)"/></svg>
    Lab Grapher
  </div>
  <nav class="tabs" id="tabs" aria-label="Sheets"></nav>
  <div class="top-actions">
    <button class="btn primary" id="importBtn" type="button">Import data</button>
    <button class="btn" id="saveProjBtn" type="button">Save project</button>
    <button class="btn" id="openProjBtn" type="button">Open project</button>
    <input type="file" id="openProjFile" accept=".json,application/json" hidden>
  </div>
</header>

<main class="layout">
  <section class="work">
    <div class="pane sheet-pane">
      <div class="pane-head">
        <h2>Worksheet</h2>
        <button class="btn small" id="addColTop" type="button">+ Column</button>
        <button class="btn small ghost" id="clearSheet" type="button">Clear</button>
      </div>
      <div class="grid-wrap" id="gridWrap"></div>
      <div class="sheet-foot" id="sheetFoot">Paste straight from Excel or Origin into any cell. Enter moves down.</div>
    </div>

    <div class="pane graph-pane">
      <div class="pane-head">
        <h2>Graph</h2>
        <div class="export-row">
          <label for="pngScale" class="hint">PNG size</label>
          <select id="pngScale" data-k="pngScale">
            <option value="1">1×</option><option value="2">2×</option><option value="3">3× (≈300 dpi)</option><option value="4">4×</option>
          </select>
          <button class="btn small" id="pngBtn" type="button">Export PNG</button>
          <button class="btn small" id="svgBtn" type="button">Export SVG</button>
        </div>
      </div>
      <div class="fig-wrap"><div id="fig" style="width:100%"></div></div>
    </div>

    <div class="pane results-pane">
      <div class="pane-head"><h2>Results</h2><button class="btn small" id="csvBtn" type="button">Export results CSV</button></div>
      <div class="results" id="results"></div>
    </div>
  </section>

  <aside class="panel" id="panel" data-mode="groups" aria-label="Settings">
    <details open>
      <summary>Data</summary>
      <div class="sec">
        <div class="field">
          <span>Layout</span>
          <div class="seg" role="radiogroup" aria-label="Layout">
            <label><input type="radio" name="mode" value="groups" data-k="mode" id="modeGroups">Groups</label>
            <label><input type="radio" name="mode" value="xy" data-k="mode" id="modeXY">XY</label>
          </div>
          <p class="hint only-groups">Each column is one group, rows are replicates.</p>
          <p class="hint only-xy">Set column roles in the worksheet header: X, Y, or Y error.</p>
        </div>
        <div class="field only-groups">
          <label class="lbl" for="ctlSel">Control group</label>
          <select id="ctlSel" data-k="control"></select>
        </div>
        <div class="field">
          <label class="lbl" for="blankIn">Blank (subtracted from every value)</label>
          <input type="number" step="any" id="blankIn" data-k="blank" placeholder="0">
        </div>
        <label class="check only-groups"><input type="checkbox" id="normIn" data-k="normalize"><span>Express as % of control<br><span class="hint">Cell viability (%) = (OD − blank) ÷ (control mean − blank) × 100</span></span></label>
      </div>
    </details>

    <details open class="only-groups">
      <summary>Statistics</summary>
      <div class="sec">
        <div class="field">
          <label class="lbl" for="errSel">Error bars</label>
          <select id="errSel" data-k="err"><option value="sd">SD</option><option value="sem">SEM</option><option value="ci">95% CI</option></select>
        </div>
        <div class="field">
          <label class="lbl" for="testSel">Test</label>
          <select id="testSel" data-k="test">
            <option value="none">None</option>
            <option value="anova">One-way ANOVA only</option>
            <option value="dunnett">ANOVA + Dunnett (each vs control)</option>
            <option value="tukey">ANOVA + Tukey (all pairs)</option>
            <option value="welch">Welch t-tests vs control (Holm)</option>
          </select>
        </div>
        <div class="pair">
          <div class="field">
            <label class="lbl" for="alphaSel">Significance level</label>
            <select id="alphaSel" data-k="alpha"><option value="0.05">α = 0.05</option><option value="0.01">α = 0.01</option></select>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="starsIn" data-k="stars"><span>Show stars on graph</span></label>
        <label class="check"><input type="checkbox" id="nsIn" data-k="showNs"><span>Also label non-significant (ns)</span></label>
      </div>
    </details>

    <details open>
      <summary>Graph</summary>
      <div class="sec">
        <div class="field only-groups">
          <label class="lbl" for="plotSel">Graph type</label>
          <select id="plotSel" data-k="plot">
            <option value="bar">Bar ± error</option>
            <option value="barpts">Bar ± error + points</option>
            <option value="dot">Dot plot (mean ± error)</option>
            <option value="box">Box plot + points</option>
          </select>
        </div>
        <div class="field only-xy">
          <label class="lbl" for="xyStyleSel">Plot style</label>
          <select id="xyStyleSel" data-k="xyStyle">
            <option value="linesym">Line + symbol</option>
            <option value="scatter">Scatter</option>
            <option value="line">Line</option>
          </select>
        </div>
        <label class="check only-xy"><input type="checkbox" id="fitIn" data-k="fit"><span>Linear fit (shows equation and R²)</span></label>
        <label class="check only-xy"><input type="checkbox" id="legendIn" data-k="legend"><span>Show legend</span></label>
        <div class="field">
          <label class="lbl" for="palSel">Colors</label>
          <select id="palSel" data-k="palette"></select>
          <div class="swatches" id="palSw" aria-hidden="true"></div>
        </div>
        <div class="color-list" id="colorList"></div>
        <div class="field"><label class="lbl" for="titleIn">Graph title</label><input type="text" id="titleIn" data-k="title" placeholder="None"></div>
        <div class="field"><label class="lbl" for="xTitleIn">X axis title</label><input type="text" id="xTitleIn" data-k="xTitle" placeholder="None"></div>
        <div class="field"><label class="lbl" for="yTitleIn">Y axis title</label><input type="text" id="yTitleIn" data-k="yTitle" placeholder="Automatic"></div>
        <div class="pair">
          <div class="field"><label class="lbl" for="yMinIn">Y min</label><input type="number" step="any" id="yMinIn" data-k="yMin" placeholder="Auto"></div>
          <div class="field"><label class="lbl" for="yMaxIn">Y max</label><input type="number" step="any" id="yMaxIn" data-k="yMax" placeholder="Auto"></div>
        </div>
        <div class="pair only-xy">
          <div class="field"><label class="lbl" for="xMinIn">X min</label><input type="number" step="any" id="xMinIn" data-k="xMin" placeholder="Auto"></div>
          <div class="field"><label class="lbl" for="xMaxIn">X max</label><input type="number" step="any" id="xMaxIn" data-k="xMax" placeholder="Auto"></div>
        </div>
        <div class="field only-groups">
          <span>Error bar direction</span>
          <div class="seg" role="radiogroup" aria-label="Error bar direction">
            <label><input type="radio" name="errDir" value="up" data-k="errDir" id="errUp">Up only</label>
            <label><input type="radio" name="errDir" value="both" data-k="errDir" id="errBoth">Up and down</label>
          </div>
        </div>
        <div class="field only-groups"><label class="lbl" for="bwIn">Bar width</label><input type="range" min="0.3" max="0.9" step="0.02" id="bwIn" data-k="barWidth"></div>

/* ---------- results ---------- */
let lastTables = {}, lastAn = null, lastSVG = '';

}
function legendSentence(sh, an) {

  const nTxt = ns.length === 1 ? `n = ${ns[0]} per group` : `n = ${ns[0]}–${ns[ns.length - 1]} per group`;

  const sh = cur(), an = lastAn; const el = $('#colorList');
  const items = !an || an.empty ? [] : an.mode === 'xy' ? an.series : an.groups;
  el.innerHTML = items.map(g => `<div class="color-row"><input type="color" value="${g.color.toLowerCase()}" data-color="${g.id}" id="col-${g.id}" aria-label="Color for ${esc(g.name)}"><label for="col-${g.id}">${esc(g.name)}</label><code>${g.color.toUpperCase()}</code></div>`).join('') +
    (Object.keys(sh.settings.colors).length ? '<button class="btn small ghost" type="button" id="resetColors">Reset to palette</button>' : '');
}
const panelEl = $('#panel');
function onSetting(e) {
  const inp = e.target; if (!inp.dataset) return;
  const sh = cur(), st = sh.settings;
  if (inp.dataset.color) { st.colors[inp.dataset.color] = inp.value.toUpperCase(); const code = inp.parentElement.querySelector('code'); if (code) code.textContent = inp.value.toUpperCase(); scheduleUpdate(false, true); return; }
  const k = inp.dataset.k; if (!k) return;
  if (inp.type === 'radio' && !inp.checked) return;
  st[k] = inp.type === 'checkbox' ? inp.checked : inp.value;
  if (k === 'mode') { st.colors = {}; if (st.mode === 'xy' && !sh.cols.some(c => c.role === 'x') && sh.cols[0]) sh.cols[0].role = 'x'; renderGrid(); syncPanel(); }
  if (k === 'palette') { st.colors = {}; renderPalettePreview(); }
  if (k === 'control') renderGrid();
  scheduleUpdate(false, e.type === 'input' && (inp.type === 'text' || inp.type === 'number' || inp.type === 'range'));
}
panelEl.addEventListener('input', onSetting);
panelEl.addEventListener('change', onSetting);
panelEl.addEventListener('click', e => { if (e.target.id === 'resetColors') { cur().settings.colors = {}; update(); } });
$('#pngScale').addEventListener('change', e => { cur().settings.pngScale = e.target.value; scheduleSave(); });

/* ---------- update loop ---------- */
let updTimer;
function scheduleUpdate(alsoPanel, keepColorList) { clearTimeout(updTimer); updTimer = setTimeout(() => { update(keepColorList); if (alsoPanel) syncPanel(); }, 120); }
function update(keepColorList) {
  const sh = cur(); const an = analyze(sh); lastAn = an;
  lastSVG = renderGraph(sh, an);
  const fig = $('#fig'); fig.innerHTML = lastSVG;
  const W = numOr(sh.settings.width, 520); fig.style.maxWidth = W + 'px';
  renderResults(sh, an);
  if (!keepColorList) renderColorList();
  const n = sh.cols.reduce((s, c) => s + c.values.filter(isNum).length, 0);
  $('#sheetFoot').textContent = `${sh.cols.length} columns · ${n} numeric values. Paste from Excel or Origin into any cell; Enter moves down.`;
  scheduleSave();
}
function renderAll() { renderTabs(); renderGrid(); syncPanel(); update(); }

/* ---------- export ---------- */
const safeName = s => (s || 'graph').replace(/[\\/:*?"<>|]+/g, '_').trim() || 'graph';
function svgToPng(svg, W, H, scale) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = Math.round(W * scale); c.height = Math.round(H * scale);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => (b ? resolve({ blob: b, url: c.toDataURL('image/png') }) : reject(new Error('PNG failed'))), 'image/png');
    };
    img.onerror = () => reject(new Error('Could not render the graph'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
$('#pngBtn').addEventListener('click', async () => {
  const sh = cur(), st = sh.settings, scale = numOr(st.pngScale, 3);
  const W = Math.round(clamp(numOr(st.width, 520), 240, 2000)), H = Math.round(clamp(numOr(st.height, 400), 200, 2000));
  try {
    const { blob, url } = await svgToPng(lastSVG, W, H, scale);
    offerFile(safeName(sh.name) + '.png', blob, () => openModal(`<h2 id="modalTitle">PNG image</h2><p>Right-click the image and choose Save image or Copy image. On a phone, press and hold it.</p><img src="${url}" alt="Exported graph"><div class="actions"><button class="btn" type="button" data-close>Close</button></div>`));
  } catch (e) { toast(e.message); }
});
$('#svgBtn').addEventListener('click', () => {
  const sh = cur();
  offerFile(safeName(sh.name) + '.svg', '<?xml version="1.0" encoding="UTF-8"?>\n' + lastSVG, () => copyText(lastSVG, 'SVG code copied. Paste it into a .svg file, Illustrator or Inkscape.'));
});
$('#csvBtn').addEventListener('click', () => {
  const sh = cur(), parts = [];
  const names = { summary: 'Summary', post: 'Post hoc tests', anova: 'ANOVA', transformed: 'Normalized values', xy: 'Series' };
  Object.entries(names).forEach(([k, t]) => { if (lastTables[k]) parts.push(t + '\n' + lastTables[k].split('\n').map(l => l.split('\t').map(c => /[",\n]/.test(c) ? `"${c.replace(/"/g, '""')}"` : c).join(',')).join('\n')); });
  if (lastTables.legend) parts.push('Figure legend\n"' + lastTables.legend.replace(/"/g, '""') + '"');
  if (!parts.length) { toast('No results to export yet'); return; }
  const csv = parts.join('\n\n');
  offerFile(safeName(sh.name) + ' results.csv', '﻿' + csv, () => copyText(csv, 'Results copied as CSV text'));
});
$('#saveProjBtn').addEventListener('click', () => {
  const json = JSON.stringify({ app: 'Lab Grapher', version: 1, ...state }, null, 1);
  offerFile('Lab Grapher project.json', json, () => openModal(`<h2 id="modalTitle">Project file</h2><p>Copy this text and save it as a .json file. Use Open project to load it later.</p><textarea readonly id="projText">${esc(json)}</textarea><div class="actions"><button class="btn" type="button" data-close>Close</button><button class="btn primary" type="button" id="copyProj">Copy</button></div>`));
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'copyProj') copyText($('#projText').value, 'Project copied'); });
$('#openProjBtn').addEventListener('click', () => $('#openProjFile').click());
$('#openProjFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s || !Array.isArray(s.sheets) || !s.sheets.length) throw new Error();
    state = normalizeState({ sheets: s.sheets, active: s.active }); renderAll(); toast(`Opened ${state.sheets.length} sheet${state.sheets.length > 1 ? 's' : ''}`);
  } catch (err) { toast('That file is not a Lab Grapher project (.json).'); }
});
$('#resetEx').addEventListener('click', () => {
  const ex = exampleSheets(); state.sheets.push(...ex); state.active = ex[0].id; renderAll(); toast('Added the example sheets');
});

/* ---------- import dialog ---------- */
function importPreview() {
  const txt = $('#impText').value, layout = $('input[name=impLayout]:checked').value;
  const rows = splitRows(txt); const out = $('#impPreview');
  if (!rows.length) { out.textContent = 'Nothing to import yet.'; return null; }
  const res = rowsToColumns(rows, layout);
  const n = res.cols.map(c => c.values.filter(isNum).length);
  out.innerHTML = `Found <b>${res.cols.length}</b> column${res.cols.length > 1 ? 's' : ''} (${res.layout === 'rows' ? 'groups were in rows' : 'groups in columns'}): ${res.cols.slice(0, 8).map((c, i) => `${esc(c.name || letter(i))} <span class="hint">n=${n[i]}</span>`).join(', ')}${res.cols.length > 8 ? ', …' : ''}`;
  return res;
}
let xlsxLoading = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxLoading) xlsxLoading = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => res(window.XLSX); s.onerror = () => { xlsxLoading = null; rej(new Error('Could not load the Excel reader. Save the sheet as CSV and try again.')); }; document.head.appendChild(s); });
  return xlsxLoading;
}
$('#importBtn').addEventListener('click', () => {
  openModal(`<h2 id="modalTitle">Import data</h2>
  <p>Paste from Excel, Origin or a text file, or choose a file. Groups can be in columns with a header row, or in rows with the name first.</p>
  <textarea id="impText" autofocus placeholder="Control&#9;3A&#9;5A&#10;1.422&#9;1.363&#9;1.516&#10;…&#10;&#10;or&#10;&#10;Control 1.422 1.425 1.427&#10;3A 1.363 1.395 1.405"></textarea>
  <div class="row"><label class="btn small" for="impFile">Choose file (.csv, .txt, .xlsx)</label><input type="file" id="impFile" accept=".csv,.tsv,.txt,.xlsx,.xls" hidden><span class="hint" id="impFileName"></span></div>
  <div class="row"><span class="hint">Layout</span><div class="seg" role="radiogroup" aria-label="Import layout" style="flex:1">
    <label><input type="radio" name="impLayout" value="auto" checked>Auto-detect</label><label><input type="radio" name="impLayout" value="columns">Groups in columns</label><label><input type="radio" name="impLayout" value="rows">Groups in rows</label></div></div>
  <div class="row"><span class="hint">Put into</span><div class="seg" role="radiogroup" aria-label="Destination" style="flex:1">
    <label><input type="radio" name="impDest" value="new" checked>New sheet</label><label><input type="radio" name="impDest" value="replace">Replace current sheet</label></div></div>
  <div class="preview" id="impPreview">Nothing to import yet.</div>
  <div class="actions"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" id="impGo">Import</button></div>`);
});
$('#modal').addEventListener('input', e => { if (e.target.id === 'impText') importPreview(); });
$('#modal').addEventListener('change', async e => {
  if (e.target.name === 'impLayout') importPreview();
  if (e.target.id === 'impFile') {
    const f = e.target.files[0]; if (!f) return; $('#impFileName').textContent = f.name;
    try {
      let text;
      if (/\.xlsx?$/i.test(f.name)) { const X = await loadXLSX(); const wb = X.read(await f.arrayBuffer(), { type: 'array' }); text = X.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]], { FS: '\t', blankrows: false }); }
      else text = await f.text();
      $('#impText').value = text; importPreview();
    } catch (err) { $('#impPreview').textContent = err.message || 'Could not read that file.'; }
  }
});
$('#modal').addEventListener('click', e => {
  if (e.target.id !== 'impGo') return;
  const res = importPreview(); if (!res || !res.cols.length) { toast('Paste some data first'); return; }
  const dest = $('input[name=impDest]:checked').value;
  const cols = res.cols.map(c => ({ name: c.name, values: c.values }));
  if (dest === 'replace') {
    const sh = cur(); const fresh = makeSheet(sh.name, cols, sh.settings); fresh.id = sh.id; fresh.settings.colors = {}; fresh.settings.control = fresh.cols[0].id;
    state.sheets[state.sheets.indexOf(sh)] = fresh;
  } else {
    const sh = makeSheet('Sheet ' + (state.sheets.length + 1), cols); state.sheets.push(sh); state.active = sh.id;
  }
  closeModal(); renderAll(); toast(`Imported ${cols.length} column${cols.length > 1 ? 's' : ''}`);
});

renderAll();

</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
